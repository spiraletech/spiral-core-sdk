name: C++20 CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Install SDK to isolated prefix
        run: cmake --install build --config ${{ matrix.build_type }} --prefix "${{ github.workspace }}/sdk-install"
      - name: Relocate SDK to prove installed package is relocatable
        run: cmake -E rename "${{ github.workspace }}/sdk-install" "${{ github.workspace }}/sdk-relocated"
      - name: Configure installed consumer
        run: cmake -S tests/downstream_consumer -B consumer-build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/sdk-relocated"
      - name: Build installed consumer
        run: cmake --build consumer-build --config ${{ matrix.build_type }}
      - name: Test installed consumer
        run: ctest --test-dir consumer-build -C ${{ matrix.build_type }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang ASan and UBSan
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build sanitized tests
        run: cmake --build build-sanitized --parallel 2
      - name: Test sanitized suite
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
